# question-authoring-db 접속 규칙(D126, 이미지 안). 루프백 trust 없음, 평문 접속 없음, 모든 암호는 scram-sha-256.
# 왜 local postgres peer: 공식 이미지의 초기화 스크립트가 OS 사용자 postgres 로 소켓에 붙는다(암호를 환경 변수로 들고 다니지 않는다). 컨테이너 밖에서는 소켓에 닿지 못한다.
local   all   postgres   peer
local   all   all        scram-sha-256
# 슈퍼유저는 네트워크로 접속하지 못한다(초기화·관리는 컨테이너 안 소켓의 peer). 앱 계정만 TLS 로 접속한다
host    all   postgres   all  reject
hostssl all   all   all  scram-sha-256
host    all   all   all  reject
