[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "question-authoring"
version = "0.1.0"
requires-python = ">=3.10"
description = "문항 저작 영역: 문항 저장소, 저작 API, I1 QuestionReader"
dependencies = ["jsonschema>=4.18", "boundary-contracts", "openit-survey-schema",
                "psycopg[binary]>=3.3.6,<3.4", "waitress>=3.0.2,<4"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["question_authoring*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
